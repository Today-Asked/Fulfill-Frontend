<!doctype html>
<html>
  <body style="margin:0; padding:32px 16px; background-color:#000000; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; margin:0 auto;">
      <tr>
        <td style="padding-bottom:28px; text-align:center;">
          <img src="https://fulfill-frontend.pages.dev/logo-mark.png" alt="Fulfill" width="52" height="36" style="display:inline-block; border:0;" />
        </td>
      </tr>
      <tr>
        <td style="background-color:#111111; border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:36px 32px;">
          <p style="margin:0 0 8px; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.4);">
            RESET PASSWORD
          </p>
          <h1 style="margin:0 0 16px; font-size:20px; font-weight:600; color:#ffffff;">
            重設你的密碼
          </h1>
          <p style="margin:0 0 28px; font-size:14px; line-height:1.7; color:#9ca3af;">
            請在密碼重設頁輸入下面這組驗證碼，設定新密碼。驗證碼 1 小時內有效。
          </p>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td style="background-color:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:20px; text-align:center;">
                <span style="font-size:32px; font-weight:700; letter-spacing:0.5em; color:#ffffff; font-family:'Courier New', monospace;">
                  {{ .Token }}
                </span>
              </td>
            </tr>
          </table>

          <p style="margin:28px 0 0; font-size:12px; line-height:1.7; color:#6b7280;">
            如果不是你本人申請重設密碼，忽略這封信即可，你的密碼不會被更改。
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding-top:24px; text-align:center;">
          <p style="margin:0; font-size:11px; color:#4b5563;">
            此信由 Fulfill 系統自動發送，請勿回覆。
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
